<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estúdio de Câmara Local</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --accent-color: #3b82f6;
            --accent-hover: #2563eb;
            --danger-color: #ef4444;
            --danger-hover: #dc2626;
            --success-color: #22c55e;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 900px;
            background-color: var(--card-bg);
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
            text-align: center;
        }

        h1 {
            margin-top: 0;
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .video-container {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            background-color: #020617;
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 20px;
            border: 2px solid #334155;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1); /* Efeito espelho padrão para webcams */
        }

        .controls {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        button {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 15px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        button:hover {
            background-color: var(--accent-hover);
            transform: translateY(-1px);
        }

        button:active {
            transform: translateY(0);
        }

        button.stop {
            background-color: var(--danger-color);
        }

        button.stop:hover {
            background-color: var(--danger-hover);
        }

        .select-container {
            margin-bottom: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        select {
            background-color: #334155;
            color: var(--text-color);
            border: 1px solid #475569;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
            cursor: pointer;
            max-width: 300px;
        }

        .status {
            font-size: 14px;
            color: #94a3b8;
            margin-top: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 6px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background-color: var(--danger-color);
            border-radius: 50%;
            display: inline-block;
        }

        .status-dot.active {
            background-color: var(--success-color);
            box-shadow: 0 0 8px var(--success-color);
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Estúdio de Câmara Local</h1>
    
    <div class="select-container">
        <label for="videoSource">Dispositivo:</label>
        <select id="videoSource"><option value="">A carregar câmaras...</option></select>
    </div>

    <div class="video-container">
        <video id="videoFeed" autoplay playsinline muted></video>
    </div>

    <div class="controls">
        <button id="startBtn">Ligar Câmara</button>
        <button id="stopBtn" class="stop">Desligar</button>
    </div>

    <div class="status">
        <span id="statusDot" class="status-dot"></span>
        <span id="statusText">Estúdio Offline</span>
    </div>
</div>

<script>
    const videoElement = document.getElementById('videoFeed');
    const startButton = document.getElementById('startBtn');
    const stopButton = document.getElementById('stopBtn');
    const videoSelect = document.getElementById('videoSource');
    const statusDot = document.getElementById('statusDot');
    const statusText = document.getElementById('statusText');
    
    let currentStream = null;

    // Listar as câmaras disponíveis
    async function getDevices() {
        try {
            const devices = await navigator.mediaDevices.enumerateDevices();
            const videoDevices = devices.filter(device => device.kind === 'videoinput');
            
            videoSelect.innerHTML = '';
            
            if (videoDevices.length === 0) {
                videoSelect.innerHTML = '<option>Nenhuma câmara encontrada</option>';
                return;
            }

            videoDevices.forEach((device, index) => {
                const option = document.createElement('option');
                option.value = device.deviceId;
                option.text = device.label || `Câmara ${index + 1}`;
                videoSelect.appendChild(option);
            });
        } catch (error) {
            console.error('Erro ao listar dispositivos:', error);
            statusText.innerText = "Erro ao aceder às permissões.";
        }
    }

    // Iniciar a transmissão da câmara
    async function startCamera() {
        if (currentStream) {
            stopCamera();
        }

        const videoSource = videoSelect.value;
        const constraints = {
            video: {
                deviceId: videoSource ? { exact: videoSource } : undefined,
                width: { ideal: 1920 },
                height: { ideal: 1080 }
            },
            audio: false // Apenas vídeo. Mude para true se quiser microfone
        };

        try {
            const stream = await navigator.mediaDevices.getUserMedia(constraints);
            currentStream = stream;
            videoElement.srcObject = stream;
            
            // Atualizar UI
            statusDot.classList.add('active');
            statusText.innerText = "Estúdio em Direto (Local)";
            
            // Atualizar lista após obter permissão (para mostrar os nomes corretos das câmaras)
            if (videoSelect.options[0] && videoSelect.options[0].text.startsWith('Câmara ')) {
                await getDevices();
            }
        } catch (error) {
            console.error('Erro ao abrir a câmara:', error);
            statusText.innerText = "Erro: Acesso negado ou câmara ocupada.";
        }
    }

    // Desligar a câmara
    function stopCamera() {
        if (currentStream) {
            currentStream.getTracks().forEach(track => track.stop());
            videoElement.srcObject = null;
            currentStream = null;
            
            // Atualizar UI
            statusDot.classList.remove('active');
            statusText.innerText = "Estúdio Offline";
        }
    }

    // Event Listeners
    startButton.addEventListener('click', startCamera);
    stopButton.addEventListener('click', stopCamera);
    videoSelect.addEventListener('change', () => {
        if (currentStream) startCamera();
    });

    // Pedir permissão inicial e carregar dispositivos
    navigator.mediaDevices.getUserMedia({ video: true })
        .then(stream => {
            // Para as faixas iniciais do teste de permissão
            stream.getTracks().forEach(track => track.stop());
            getDevices();
        })
        .catch(err => {
            console.error("Permissão inicial negada:", err);
            statusText.innerText = "Por favor, dê permissão de câmara nas definições.";
        });
</script>

</body>
</html>
