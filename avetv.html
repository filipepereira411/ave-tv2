<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estúdio de Câmara Local com Gravação</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --accent-color: #3b82f6;
            --accent-hover: #2563eb;
            --danger-color: #ef4444;
            --danger-hover: #dc2626;
            --success-color: #22c55e;
            --success-hover: #16a34a;
            --warning-color: #f59e0b;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 900px;
            background-color: var(--card-bg);
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
            text-align: center;
        }

        h1 {
            margin-top: 0;
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .video-container {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            background-color: #020617;
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 20px;
            border: 2px solid #334155;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1); /* Efeito espelho padrão para webcams */
        }

        .controls {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        button {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 15px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        button:hover {
            background-color: var(--accent-hover);
            transform: translateY(-1px);
        }

        button:disabled {
            background-color: #475569;
            color: #94a3b8;
            cursor: not-allowed;
            transform: none;
        }

        button.stop { background-color: var(--danger-color); }
        button.stop:hover { background-color: var(--danger-hover); }

        button.record { background-color: var(--warning-color); color: #000; }
        button.record.recording { background-color: var(--danger-color); color: #fff; animation: pulse 1.5s infinite; }
        
        button.photo { background-color: var(--success-color); }
        button.photo:hover { background-color: var(--success-hover); }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.6; }
            100% { opacity: 1; }
        }

        .options-container {
            margin-bottom: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .select-container, .checkbox-container {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        select {
            background-color: #334155;
            color: var(--text-color);
            border: 1px solid #475569;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
            cursor: pointer;
        }

        .status {
            font-size: 14px;
            color: #94a3b8;
            margin-top: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 6px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background-color: var(--danger-color);
            border-radius: 50%;
            display: inline-block;
        }

        .status-dot.active {
            background-color: var(--success-color);
            box-shadow: 0 0 8px var(--success-color);
        }

        /* Galeria de Capturas */
        .gallery {
            margin-top: 30px;
            border-top: 1px solid #334155;
            padding-top: 20px;
            text-align: left;
        }

        .gallery h2 {
            font-size: 18px;
            margin-bottom: 15px;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 16px;
        }

        .gallery-item {
            background-color: #0f172a;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid #334155;
            display: flex;
            flex-direction: column;
        }

        .gallery-item img, .gallery-item video {
            width: 100%;
            aspect-ratio: 16 / 9;
            object-fit: cover;
            background-color: #000;
        }

        .gallery-item a {
            color: var(--accent-color);
            text-decoration: none;
            font-size: 12px;
            padding: 8px;
            text-align: center;
            font-weight: 600;
            border-top: 1px solid #334155;
            background-color: #1e293b;
            transition: background 0.2s;
        }

        .gallery-item a:hover {
            background-color: var(--accent-color);
            color: white;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Estúdio de Câmara Local</h1>
    
    <div class="options-container">
        <div class="select-container">
            <label for="videoSource">Dispositivo:</label>
            <select id="videoSource"><option value="">A carregar câmaras...</option></select>
        </div>
        <div class="checkbox-container">
            <input type="checkbox" id="audioToggle">
            <label for="audioToggle">Incluir Microfone</label>
        </div>
    </div>

    <div class="video-container">
        <video id="videoFeed" autoplay playsinline muted></video>
    </div>

    <div class="controls">
        <button id="startBtn">Ligar Câmara</button>
        <button id="stopBtn" class="stop" disabled>Desligar</button>
        <button id="photoBtn" class="photo" disabled>📸 Tirar Foto</button>
        <button id="recordBtn" class="record" disabled>🔴 Gravar Vídeo</button>
    </div>

    <div class="status">
        <span id="statusDot" class="status-dot"></span>
        <span id="statusText">Estúdio Offline</span>
    </div>

    <!-- Nova secção de mídia capturada -->
    <div class="gallery">
        <h2>Capturas Recentes</h2>
        <div id="galleryGrid" class="gallery-grid">
            <!-- As fotos e vídeos gravados vão aparecer aqui -->
        </div>
    </div>
</div>

<script>
    const videoElement = document.getElementById('videoFeed');
    const startButton = document.getElementById('startBtn');
    const stopButton = document.getElementById('stopBtn');
    const photoButton = document.getElementById('photoBtn');
    const recordButton = document.getElementById('recordBtn');
    const videoSelect = document.getElementById('videoSource');
    const audioToggle = document.getElementById('audioToggle');
    const statusDot = document.getElementById('statusDot');
    const statusText = document.getElementById('statusText');
    const galleryGrid = document.getElementById('galleryGrid');
    
    let currentStream = null;
    let mediaRecorder = null;
    let recordedChunks = [];
    let isRecording = false;

    // Listar as câmaras disponíveis
    async function getDevices() {
        try {
            const devices = await navigator.mediaDevices.enumerateDevices();
            const videoDevices = devices.filter(device => device.kind === 'videoinput');
            
            videoSelect.innerHTML = '';
            if (videoDevices.length === 0) {
                videoSelect.innerHTML = '<option>Nenhuma câmara encontrada</option>';
                return;
            }

            videoDevices.forEach((device, index) => {
                const option = document.createElement('option');
                option.value = device.deviceId;
                option.text = device.label || `Câmara ${index + 1}`;
                videoSelect.appendChild(option);
            });
        } catch (error) {
            console.error('Erro ao listar dispositivos:', error);
        }
    }

    // Iniciar a transmissão da câmara
    async function startCamera() {
        if (currentStream) {
            stopCamera();
        }

        const videoSource = videoSelect.value;
        const constraints = {
            video: {
                deviceId: videoSource ? { exact: videoSource } : undefined,
                width: { ideal: 1920 },
                height: { ideal: 1080 }
            },
            audio: audioToggle.checked // Deteta se o utilizador quer microfone
        };

        try {
            const stream = await navigator.mediaDevices.getUserMedia(constraints);
            currentStream = stream;
            videoElement.srcObject = stream;
            
            // Alterar estado dos botões
            startButton.disabled = true;
            stopButton.disabled = false;
            photoButton.disabled = false;
            recordButton.disabled = false;
            
            statusDot.classList.add('active');
